<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程遊戲</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one 16:9 stage (3:4 on a portrait phone) holds every screen and scales as a unit. */
  --night:#0f0b08;   /* page behind the stage */
  --ink:#17120d;     /* menu screens */
  --wood:#261a12;    /* dialogue box and plates */
  --cream:#f1e2bf;   /* borders and text on wood */
  --gold:#f2bf4e;    /* the guiding character, blanks, lit lamps */
  --seal:#c2351f;    /* vermilion stamp: correct answers, warnings */
  --jade:#bfdcc8;    /* narration */
  --paper:#f6ecd0;   /* notes and the proof sheet */
  --dark:#27231e;    /* text on paper */
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-talk:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--font-ui);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#game{height:100%;display:grid;place-items:center;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--ink);width:960px;height:540px;--u:9.6px;--sh:540px;--fs:1;user-select:none;-webkit-user-select:none}
#stage input,#stage textarea{user-select:text;-webkit-user-select:text}
.screen{position:absolute;inset:0}
.fill{position:absolute;inset:0;background-size:cover;background-position:50% 0}
.glow{background:radial-gradient(120% 90% at 78% 8%,rgba(242,191,78,.2),rgba(242,191,78,0) 55%),linear-gradient(160deg,#241a12,#120d09 70%)}
.eyebrow{margin:0;font-size:max(11px,calc(var(--u)*1.3));letter-spacing:.3em;color:var(--gold);font-weight:700}
.btn{border:1px solid var(--cream);background:rgba(241,226,191,.08);border-radius:calc(var(--u)*.9);padding:calc(var(--u)*.65) calc(var(--u)*1.6);font-size:max(13px,calc(var(--u)*1.5));font-weight:700;line-height:1.3;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(241,226,191,.2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#2b1e15}
.btn.primary:hover:not(:disabled){background:#ffd470}
.btn:disabled{opacity:.45;cursor:default}
.btn small{font-weight:400;opacity:.85;margin-left:.5em}
.link{background:none;border:0;padding:0;color:var(--cream);text-decoration:underline;text-underline-offset:.2em;font-size:max(12px,calc(var(--u)*1.3))}
.link:hover{color:var(--gold)}
.msg{margin:0;min-height:1.5em;font-size:max(12px,calc(var(--u)*1.3));color:#ffb9a6}
.msg.good{color:var(--jade)}
.seg{display:flex;border:1px solid rgba(241,226,191,.5);border-radius:99px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:calc(var(--u)*.5) calc(var(--u)*1);font-size:max(13px,calc(var(--u)*1.45));font-weight:700}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--cream);color:#2b1e15}

/* title */
.title-wrap{position:absolute;inset:0;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*3) calc(var(--u)*6);overflow:auto}
.title-head h1{margin:calc(var(--u)*1.2) 0 calc(var(--u)*1.6);font-family:var(--font-display);font-weight:900;font-size:calc(var(--u)*7.4);line-height:1.1;letter-spacing:.05em;text-shadow:0 .05em 0 rgba(0,0,0,.6);text-wrap:balance}
.tagline{margin:0;font-family:var(--font-talk);font-size:max(14px,calc(var(--u)*2));text-wrap:balance}
.card{background:rgba(38,26,18,.92);border:max(2px,calc(var(--u)*.2)) solid var(--cream);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.2);display:flex;flex-direction:column;gap:calc(var(--u)*1.1)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.9) calc(var(--u)*1.2)}
.fields .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:.25em;font-size:max(12px,calc(var(--u)*1.25));color:rgba(241,226,191,.85)}
label.f input,label.f textarea{font-size:16px;padding:.45em .7em;background:rgba(0,0,0,.3);border:1px solid rgba(241,226,191,.4);border-radius:calc(var(--u)*.7);color:#fff8e6;width:100%;min-width:0}
label.f textarea{resize:none;height:5.5em;font-family:var(--font-ui)}
label.f input:focus,label.f textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,191,78,.35)}

/* story menu */
.hub-wrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.3);padding:calc(var(--u)*2.2) calc(var(--u)*3)}
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;flex-wrap:wrap}
.hub-head h2{margin:.1em 0 0;font-family:var(--font-display);font-weight:900;font-size:calc(var(--u)*3.2);letter-spacing:.05em}
.who{display:flex;align-items:center;gap:calc(var(--u)*1);font-size:max(12px,calc(var(--u)*1.35));flex-wrap:wrap}
.hub-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);gap:calc(var(--u)*1.6)}
.themes{display:flex;flex-direction:column;gap:calc(var(--u)*.6);overflow:auto;padding:2px}
.theme{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*1);align-items:center;text-align:left;padding:calc(var(--u)*.7) calc(var(--u)*1.1);border:1px solid rgba(241,226,191,.35);border-radius:calc(var(--u)*1.1);background:rgba(38,26,18,.75)}
.theme[aria-selected="true"]{border-color:var(--gold);background:rgba(242,191,78,.16)}
.theme .no{font-family:var(--font-display);font-weight:900;font-size:calc(var(--u)*2.6);line-height:1;color:var(--gold);width:1.2em;text-align:center}
.theme .nm{display:block;font-weight:700;font-size:max(13px,calc(var(--u)*1.45));line-height:1.3}
.theme .sub{display:block;font-size:max(11px,calc(var(--u)*1.15));opacity:.75}
.lamp{font-size:max(11px,calc(var(--u)*1.15));font-variant-numeric:tabular-nums;padding:.1em .6em;border-radius:99px;border:1px solid rgba(241,226,191,.4);white-space:nowrap}
.lamp.lit{background:var(--gold);border-color:var(--gold);color:#2b1e15;font-weight:700}
.units-pane{display:flex;flex-direction:column;min-height:0;gap:calc(var(--u)*1)}
.theme-info h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:max(15px,calc(var(--u)*2.1));letter-spacing:.04em;text-wrap:balance}
.theme-info p{margin:.25em 0 0;font-family:var(--font-talk);font-size:max(12px,calc(var(--u)*1.4));color:rgba(241,226,191,.85);max-width:46em}
.units{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:calc(var(--u)*.6);overflow:auto;flex:1;min-height:0}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*1.2);align-items:center;padding:calc(var(--u)*.75) calc(var(--u)*1.3);border:1px solid rgba(241,226,191,.5);border-radius:calc(var(--u)*1.1);background:rgba(38,26,18,.8)}
.unit.closed{opacity:.5;border-style:dashed}
.unit .no{font-family:var(--font-display);font-weight:900;font-size:calc(var(--u)*2);color:var(--gold);width:1.2em;text-align:center}
.unit h4{margin:0;font-size:max(13px,calc(var(--u)*1.55));font-weight:700;line-height:1.35}
.unit p{margin:.1em 0 0;font-size:max(11px,calc(var(--u)*1.2));color:rgba(241,226,191,.75)}
.chip{display:inline-block;font-size:max(11px,calc(var(--u)*1.15));font-weight:700;padding:.05em .6em;border-radius:99px;margin-right:.5em;background:rgba(241,226,191,.14)}
.chip.open{background:rgba(191,220,200,.22);color:var(--jade)}
.chip.done{background:var(--gold);color:#2b1e15}
.chip.late{background:rgba(194,53,31,.35);color:#ffd9cf}
.hub-msg{margin:0}

/* briefing */
.brief-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--u)*2.5) calc(var(--u)*5);overflow:auto}
.brief{width:100%;max-width:calc(var(--u)*84);gap:calc(var(--u)*1)}
.brief h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:max(18px,calc(var(--u)*3));letter-spacing:.04em;line-height:1.25;text-wrap:balance}
.brief dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3em 1.2em;font-size:max(12px,calc(var(--u)*1.4))}
.brief dt{color:var(--gold);font-weight:700;white-space:nowrap}
.brief dd{margin:0;font-family:var(--font-talk)}
.notice{margin:0;padding:calc(var(--u)*.8) calc(var(--u)*1.2);border-left:calc(var(--u)*.5) solid var(--gold);background:rgba(242,191,78,.12);font-size:max(12px,calc(var(--u)*1.4));border-radius:0 calc(var(--u)*.6) calc(var(--u)*.6) 0}
.notice.warn{border-left-color:var(--seal);background:rgba(194,53,31,.2)}
.gate{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*.8);align-items:end}
.row{display:flex;gap:calc(var(--u)*1);justify-content:flex-end;align-items:center;flex-wrap:wrap}

/* play */
.bg{opacity:0;transition:opacity .6s ease;background-position:var(--focus,50%) 0;background-color:#1b140e}
.bg.on{opacity:1}
.hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*1);padding:calc(var(--u)*1.2) calc(var(--u)*1.5);flex-wrap:wrap;pointer-events:none}
.hud > *{pointer-events:auto}
.hud-left,.hud-right{display:flex;align-items:center;gap:calc(var(--u)*.6);flex-wrap:wrap}
.plate,.hbtn{font-size:max(11px,calc(var(--u)*1.3));line-height:1.3;padding:calc(var(--u)*.4) calc(var(--u)*1.1);border-radius:99px;border:1px solid rgba(241,226,191,.6);background:rgba(38,26,18,.85);color:var(--cream);white-space:nowrap}
.plate.unit-name{max-width:calc(var(--u)*34);overflow:hidden;text-overflow:ellipsis}
.plate.mode{border-color:var(--seal);background:rgba(120,30,18,.9)}
.plate.score{font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.plate.sync{border-color:transparent;background:rgba(18,12,8,.6)}
.hbtn{font-weight:700}
.hbtn:hover{background:rgba(70,50,34,.95)}
.hbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2b1e15}
.plus{position:absolute;right:0;top:100%;margin-top:.2em;color:var(--gold);font-weight:700;font-size:1.25em;text-shadow:0 1px 0 #000;animation:rise 1.2s ease forwards;pointer-events:none;white-space:nowrap}

.dock{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;padding:0 5.5% calc(var(--sh)*.02);pointer-events:none}
.above{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.9);padding:calc(var(--u)*5.5) 0 calc(var(--u)*3.2);overflow-y:auto;scrollbar-width:none}
.above::before{content:"";flex:1}
.above > *{pointer-events:auto;flex:none}
.dlg{position:relative;flex:0 0 auto;min-height:calc(var(--sh)*.325);display:flex;flex-direction:column;pointer-events:auto;cursor:pointer;
  border:max(2px,calc(var(--u)*.22)) solid var(--cream);border-radius:calc(var(--u)*2.4);
  background:rgba(38,26,18,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding:calc(var(--u)*3.2) calc(var(--u)*3.6) calc(var(--u)*1.2);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2) rgba(0,0,0,.45)}
.dlg.solid{background:linear-gradient(180deg,#34251a,#22160f)}
.dlg.shake{animation:shake .38s ease}
.dlg-name{position:absolute;left:calc(var(--u)*3);top:0;transform:translateY(-60%);min-width:5.2em;text-align:center;
  font-family:var(--font-display);font-weight:900;font-size:max(15px,calc(var(--u)*2.3));letter-spacing:.08em;line-height:1.35;
  padding:calc(var(--u)*.45) calc(var(--u)*2);border:max(2px,calc(var(--u)*.22)) solid var(--cream);border-radius:calc(var(--u)*1.5);background:#2b1e15;color:var(--cream)}
.dlg-name.hero{background:var(--gold);color:#2b1e15;border-color:#fff1c9}
.talk{font-family:var(--font-talk);line-height:1.72;letter-spacing:.03em}
.dlg-text{flex:1;margin:0;font-size:max(15px,calc(var(--u)*2.3*var(--fs)));color:#fbf0d6}
.dlg.narr .dlg-text{color:var(--jade)}
.pend{visibility:hidden}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.2);min-height:calc(var(--u)*3.6);margin-top:calc(var(--u)*.6);flex-wrap:wrap}
.dlg-tip{flex:1;min-width:12em;font-size:max(11px,calc(var(--u)*1.3));color:rgba(241,226,191,.82)}
.dlg-actions{display:flex;gap:calc(var(--u)*.9);margin-left:auto;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.dlg-next{margin-left:auto;font-size:calc(var(--u)*2);line-height:1;color:var(--cream);animation:bob 1s ease-in-out infinite}

.slot{display:inline-flex;align-items:stretch;vertical-align:baseline;margin:0 .25em;border:1px dashed var(--gold);border-radius:.4em;background:rgba(242,191,78,.12);line-height:1.35;overflow:hidden}
.slot-tag{display:flex;align-items:center;font-family:var(--font-ui);font-size:.55em;font-weight:700;letter-spacing:0;background:var(--gold);color:#2b1e15;padding:0 .55em;white-space:nowrap}
.slot-body{min-width:2.4em;padding:0 .35em;text-align:center;color:var(--gold);font-weight:700}
.slot.solved{border-style:solid;background:rgba(242,191,78,.2)}
.slot.pick{cursor:pointer}
.slot.now{box-shadow:0 0 0 2px var(--gold)}
.slot.bad{animation:shake .38s ease;border-color:#ff9a84}
.slot input{display:block;border:0;border-bottom:2px solid var(--cream);background:transparent;color:#fff8e6;text-align:center;padding:0 .2em;font-weight:700;letter-spacing:.05em;border-radius:0;height:100%}
.slot input::placeholder{color:rgba(241,226,191,.75);font-weight:400;font-size:.7em;letter-spacing:0}
.slot input:focus{outline:none;border-bottom-color:var(--gold);background:rgba(255,255,255,.1)}

.onpaper{background:var(--paper);color:var(--dark);border-radius:calc(var(--u)*.5);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.toast{align-self:flex-start;max-width:min(100%,34em);background:#fbf3df;color:var(--dark);border-left:calc(var(--u)*.6) solid var(--seal);border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.7) calc(var(--u)*1.3);font-size:max(13px,calc(var(--u)*1.5));white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.toast:empty{display:none}
.sheet{align-self:stretch;padding:calc(var(--u)*1) calc(var(--u)*1.6) calc(var(--u)*1.2);border-top:calc(var(--u)*.6) solid var(--wood)}
.sheet h4,.note h4{margin:0 0 .3em;font-size:max(11px,calc(var(--u)*1.25));letter-spacing:.2em;color:#7a5a10}
.sheet p{margin:0;font-size:max(14px,calc(var(--u)*1.9*var(--fs)))}
.sheet p + p{margin-top:.3em}
.sheet .slot{border-color:#8a6a1c;background:rgba(138,106,28,.12)}
.sheet .slot-body{color:#6b4d00}
.sheet .slot input{color:var(--dark);border-bottom-color:#8a6a1c}
.sheet .slot input::placeholder{color:#8f7a4c}
.sheet .slot input:focus{background:rgba(138,106,28,.16);border-bottom-color:var(--seal)}
.choices{align-self:center;width:min(100%,38em);display:flex;flex-direction:column;gap:calc(var(--u)*.7);align-items:stretch}
.choices .q{margin:0;align-self:center;text-align:center;font-size:max(12px,calc(var(--u)*1.4));font-weight:700;color:var(--gold);background:rgba(38,26,18,.92);padding:.25em 1.1em;border-radius:calc(var(--u)*1.2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.7)}
.choice{border:max(2px,calc(var(--u)*.2)) solid var(--cream);border-radius:calc(var(--u)*1.1);background:rgba(38,26,18,.95);padding:calc(var(--u)*.7) calc(var(--u)*1.2);font-family:var(--font-talk);font-weight:700;font-size:max(15px,calc(var(--u)*2));letter-spacing:.08em}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2b1e15}
.choice:disabled{opacity:.5;text-decoration:line-through;cursor:default}
.choices .btn{align-self:center}
.note{align-self:flex-end;width:min(100%,32em);padding:calc(var(--u)*1) calc(var(--u)*1.4) calc(var(--u)*1.1);font-size:max(13px,calc(var(--u)*1.5));border-top:calc(var(--u)*.6) solid var(--gold)}
.note.ok{border-top-color:var(--seal)}
.note.ok h4{color:var(--seal)}
.note ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em}
.note li b{margin-right:.5em;white-space:nowrap}
.note p{margin:0}
.note p+p{margin-top:.5em}
.note p+h4{margin-top:.9em}
.stamp{position:absolute;left:50%;top:30%;z-index:7;width:calc(var(--u)*14);height:calc(var(--u)*14);margin:calc(var(--u)*-7) 0 0 calc(var(--u)*-7);display:grid;place-items:center;
  border:calc(var(--u)*.7) solid var(--seal);border-radius:calc(var(--u)*1.6);background:rgba(255,246,228,.9);color:var(--seal);
  font-family:var(--font-display);font-weight:900;font-size:calc(var(--u)*4.6);line-height:1.1;writing-mode:vertical-rl;letter-spacing:.08em;opacity:0;transform:rotate(-9deg);pointer-events:none}
.stamp.go{animation:stamp 1.15s ease forwards}

.ov{position:absolute;inset:0;z-index:9;background:rgba(18,12,8,.975);display:flex;flex-direction:column;padding:calc(var(--u)*2.6) calc(var(--u)*5) calc(var(--u)*2.2);gap:calc(var(--u)*1.3);cursor:default}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:1em}
.ov-head h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:max(16px,calc(var(--u)*2.5));letter-spacing:.08em}
.ov-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.1);padding-right:calc(var(--u)*1)}
.log-line{display:grid;grid-template-columns:5.5em 1fr;gap:1em;font-family:var(--font-talk);font-size:max(14px,calc(var(--u)*1.7));line-height:1.6;user-select:text;-webkit-user-select:text}
.log-line .w{color:var(--gold);font-weight:700;text-align:right}
.log-line.narr{color:var(--jade)}
.log-line mark{background:none;color:var(--gold);font-weight:700;border-bottom:1px solid var(--gold)}
.set-row{display:grid;grid-template-columns:7em minmax(0,22em);align-items:center;gap:1em;font-size:max(13px,calc(var(--u)*1.5))}
.fb-q{margin:0;font-family:var(--font-talk);font-size:max(13px,calc(var(--u)*1.6))}
.dbt{border-collapse:collapse;font-size:12px;width:100%;user-select:text;-webkit-user-select:text}
.dbt th,.dbt td{border:1px solid rgba(241,226,191,.3);padding:3px 7px;text-align:left;vertical-align:top;white-space:nowrap;max-width:22em;overflow:hidden;text-overflow:ellipsis}
.dbt th{background:rgba(241,226,191,.14)}
.db-wrap{overflow:auto;flex:none;max-height:none}
.ov-body h4{margin:0;font-size:max(13px,calc(var(--u)*1.5));color:var(--gold)}

/* ending */
.end-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--u)*3) calc(var(--u)*6);background:rgba(15,11,8,.55);overflow:auto}
.end-card{width:100%;max-width:calc(var(--u)*72);background:var(--paper);color:var(--dark);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*2.4) calc(var(--u)*3);display:flex;flex-direction:column;gap:calc(var(--u)*1.1);align-items:center;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6);border-top:calc(var(--u)*1) solid var(--seal)}
.end-card h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:max(18px,calc(var(--u)*3));color:var(--seal);letter-spacing:.06em;text-wrap:balance}
.end-score{margin:0;font-size:max(13px,calc(var(--u)*1.6))}
.end-score b{font-family:var(--font-display);font-size:1.9em;font-variant-numeric:tabular-nums;margin:0 .15em}
.clue-name{margin:0;font-weight:700;letter-spacing:.2em;font-size:max(12px,calc(var(--u)*1.4));color:#7a5a10}
.clue{margin:0;font-family:var(--font-display);font-weight:900;font-size:max(20px,calc(var(--u)*3.6));line-height:1.4;text-wrap:balance}
.end-note{margin:0;font-family:var(--font-talk);font-size:max(12px,calc(var(--u)*1.45));max-width:38em}
.end-check{display:flex;gap:.6em;align-items:center;font-size:max(13px,calc(var(--u)*1.5));font-weight:700;cursor:pointer}
.end-check input{width:1.2em;height:1.2em;accent-color:var(--seal)}
.end-card .btn{border-color:var(--dark);color:var(--dark)}
.end-card .btn.primary{background:var(--seal);border-color:var(--seal);color:#fff}

#busy{position:absolute;inset:0;z-index:20;background:rgba(15,11,8,.7);display:grid;place-items:center;font-size:max(14px,calc(var(--u)*1.8));letter-spacing:.2em}

#stage.portrait .title-wrap{grid-template-columns:1fr;align-content:start;gap:calc(var(--u)*2);padding:calc(var(--u)*3)}
#stage.portrait .tagline{display:none}
#stage.portrait .title-head h1{font-size:calc(var(--u)*5.6);margin-bottom:0}
#stage.portrait .hub-wrap,#stage.portrait .ov,#stage.portrait .brief-wrap,#stage.portrait .end-wrap{padding-inline:calc(var(--u)*2)}
#stage.portrait .hub-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
#stage.portrait .themes{flex-direction:row;overflow-x:auto}
#stage.portrait .theme{flex:none;grid-template-columns:auto auto}
#stage.portrait .theme .sub,#stage.portrait .theme .lamp{display:none}
#stage.portrait .unit{grid-template-columns:auto 1fr}
#stage.portrait .unit .act{grid-column:1/-1;justify-self:end}
#stage.portrait .dock{padding-inline:2.5%}
#stage.portrait .dlg{padding-inline:calc(var(--u)*2.2)}
#stage.portrait .opts{grid-template-columns:1fr}
#stage.portrait #scr-play.baked .dock::before{content:"";position:absolute;left:0;right:0;bottom:0;z-index:-1;height:calc(var(--sh)*.37);background:linear-gradient(180deg,rgba(26,17,11,0),#1a110b 14%)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(22%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.2%)}40%{transform:translateX(1.2%)}60%{transform:translateX(-.8%)}80%{transform:translateX(.8%)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(2.3)}16%{opacity:1;transform:rotate(-9deg) scale(.96)}24%{transform:rotate(-9deg) scale(1.04)}32%{transform:rotate(-9deg) scale(1)}78%{opacity:1;transform:rotate(-9deg) scale(1)}100%{opacity:0;transform:rotate(-9deg) scale(1)}}
@keyframes stampfade{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-120%)}}
@media (prefers-reduced-motion:reduce){
  .dlg.shake,.slot.bad,.dlg-next{animation:none}
  .stamp.go{animation:stampfade 1.15s ease forwards}
  .bg{transition:none}
}

/* ══════════ 老師後台：一般的直向捲動頁面，淺色紙張配色 ══════════ */
.title-foot{position:absolute;z-index:2;left:calc(var(--u)*6);bottom:calc(var(--u)*2.4);margin:0}
.title-foot .link{opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#stage.portrait .title-foot{left:calc(var(--u)*3)}
/* 登入畫面的背景圖（「故事宇宙總表 › 宇宙設定」的「登入畫面背景圖」） */
#title-bg{background-position:50% 50%;opacity:0;transition:opacity .6s}
#title-bg::after{content:"";position:absolute;inset:0}
#scr-title.has-cover #title-bg{opacity:1}
/* 圖上沒有遊戲名稱：左側壓暗，文字標題照常顯示 */
#scr-title.has-cover:not(.cover-titled) #title-bg::after{background:linear-gradient(90deg,rgba(18,13,9,.88),rgba(18,13,9,.62) 48%,rgba(18,13,9,.3))}
/* 圖上已有遊戲名稱：隱藏文字標題，登入框置中靠下 */
#scr-title.has-cover.cover-titled #title-bg::after{background:linear-gradient(0deg,rgba(18,13,9,.6),rgba(18,13,9,0) 44%)}
#scr-title.has-cover.cover-titled .title-head{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#scr-title.has-cover.cover-titled .title-wrap{grid-template-columns:1fr;align-items:end;align-content:end;justify-items:center;gap:0;padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*3)}
#scr-title.has-cover.cover-titled .card{width:min(100%,calc(var(--u)*31));padding:calc(var(--u)*1.5) calc(var(--u)*1.8);gap:calc(var(--u)*.8);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*3) rgba(0,0,0,.5)}
#scr-title.has-cover.cover-titled .card{background:rgba(38,26,18,.97)}
#scr-title.has-cover.cover-titled .card:not(.reg) .fields{grid-template-columns:1.4fr 1fr}
#scr-title.has-cover.cover-titled .fields .wide{grid-column:auto}
#scr-title.has-cover.cover-titled .card.reg{width:min(100%,calc(var(--u)*52))}
/* 建立帳號時欄位較多：把背景壓暗，表單仍靠下，圖上方的標題留著 */
#scr-title.has-cover.cover-titled.reg-mode #title-bg::after{background:rgba(18,13,9,.72)}
#scr-title.has-cover.cover-titled .card.reg .fields{grid-template-columns:1fr 1fr 1fr}
#stage.portrait #scr-title.has-cover.cover-titled .card.reg .fields{grid-template-columns:1fr 1fr}
#scr-title.has-cover.cover-titled .msg:empty{display:none}
/* 直式手機專用的背景圖：圖片依寬度縮放、靠上對齊，下方不夠的地方用圖片底部的顏色補滿；登入框放在最下面 */
#scr-title.has-cover.cover-tall #title-bg{background-size:100% auto;background-position:50% 0;background-repeat:no-repeat}
#scr-title.has-cover.cover-titled.cover-tall:not(.reg-mode) #title-bg::after{background:none}
#scr-title.has-cover.cover-titled.cover-tall .title-wrap{padding-bottom:calc(var(--u)*2.4)}
#scr-title.has-cover.cover-titled.cover-tall .card:not(.reg){width:min(100%,calc(var(--u)*40));padding:calc(var(--u)*1.2) calc(var(--u)*1.4);gap:calc(var(--u)*.7)}
#scr-title.has-cover.cover-tall .title-foot{bottom:auto;top:calc(var(--u)*1.2)}   /* 下方留給登入框，連結移到左上角 */
#scr-title.has-cover.cover-tall .title-foot .link{font-size:max(12px,calc(var(--u)*1.5))}
#scr-title.has-cover.cover-tall:not(.reg-mode) .title-foot .link{color:#5b4733;text-shadow:none;opacity:.9}
/* 橫式登入：收成一條橫列貼在最下方，只蓋住圖片最底下一小條 */
#stage:not(.portrait) #scr-title.has-cover.cover-titled:not(.reg-mode) #title-bg::after{background:linear-gradient(0deg,rgba(18,13,9,.55),rgba(18,13,9,0) 24%)}
#stage:not(.portrait) #scr-title.has-cover.cover-titled:not(.reg-mode) .title-wrap{padding-bottom:calc(var(--u)*1.5)}
#stage:not(.portrait) #scr-title.has-cover.cover-titled .card:not(.reg){width:min(100%,calc(var(--u)*62));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--u)*.5) calc(var(--u)*1.2);padding:calc(var(--u)*.9) calc(var(--u)*1.2);border-radius:calc(var(--u)*1.6)}
#stage:not(.portrait) #scr-title.has-cover.cover-titled .card:not(.reg) .seg{grid-row:2;grid-column:1}
#stage:not(.portrait) #scr-title.has-cover.cover-titled .card:not(.reg) .seg button{flex:0 0 auto;white-space:nowrap;padding-inline:calc(var(--u)*1.3)}
#stage:not(.portrait) #scr-title.has-cover.cover-titled .card:not(.reg) .fields{grid-row:2;grid-column:2;grid-template-columns:1.2fr 1fr;gap:calc(var(--u)*1)}
#stage:not(.portrait) #scr-title.has-cover.cover-titled .card:not(.reg) #auth-go{grid-row:2;grid-column:3;padding-inline:calc(var(--u)*2.4)}
#stage:not(.portrait) #scr-title.has-cover.cover-titled .card:not(.reg) .msg{grid-row:1;grid-column:1/-1;min-height:0;text-align:center}
#scr-title.has-cover.cover-titled .card:not(.reg) label.f{font-size:0;gap:0}   /* 標籤留給報讀軟體，畫面上改看輸入框裡的提示字 */
#scr-title.has-cover.cover-titled .title-foot{left:calc(var(--u)*3)}
#admin{position:fixed;inset:0;overflow:auto;background:#f7f1e1;color:var(--dark);color-scheme:light;font-size:15px;line-height:1.55}
.ad-wrap{max-width:1180px;margin:0 auto;padding:22px 20px 72px}
.ad-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;border-bottom:3px double var(--dark);padding-bottom:12px}
.ad-eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.3em;color:var(--seal)}
.ad-top h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1.2}
.ad-row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.ad-row .grow{flex:1 1 220px;min-width:0}
.ad-btn{border:1.5px solid var(--dark);background:transparent;color:var(--dark);border-radius:8px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.ad-btn:hover:not(:disabled){background:rgba(39,35,30,.09)}
.ad-btn.pri{background:var(--dark);color:#f7f1e1}
.ad-btn.pri:hover:not(:disabled){background:#000}
.ad-btn.warn{border-color:var(--seal);background:var(--seal);color:#fff}
.ad-btn:disabled{opacity:.4;cursor:default}
.ad-link{border:0;background:none;padding:0 0 0 8px;color:#6b6152;text-decoration:underline;font-size:13px}
#admin :focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.ad-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid #cdbf9a}
.ad-tabs button{border:0;background:none;padding:10px 16px 8px;font-weight:700;font-size:15px;color:#6b6152;border-bottom:3px solid transparent;margin-bottom:-1px}
.ad-tabs button[aria-selected=true]{color:var(--dark);border-bottom-color:var(--seal)}
.ad-badge{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--seal);color:#fff;font-size:12px;line-height:20px;text-align:center}
.ad-msg{margin:10px 0 6px;min-height:1.55em;font-size:14px;font-weight:700;color:var(--seal)}
.ad-msg.good{color:#256341}
.ad-note{margin:0 0 12px;font-size:13.5px;color:#6b6152;max-width:78ch}
.ad-card{background:#fffaf0;border:1px solid #d9cba6;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.ad-card h2{margin:0 0 8px;font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:.04em}
.ad-card .ad-row h2{margin:0;flex:1 1 auto}
.ad-scroll{overflow:auto;max-height:72vh}
.ad-table{width:100%;border-collapse:collapse;font-size:14px}
.ad-table th,.ad-table td{padding:8px 10px;border-bottom:1px solid #e6dbbd;text-align:left;vertical-align:top}
.ad-table th{position:sticky;top:0;z-index:1;background:#fffaf0;font-size:12.5px;color:#6b6152;white-space:nowrap;border-bottom:1.5px solid var(--dark)}
.ad-table tr:last-child td{border-bottom:0}
.ad-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ad-table .code{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ad-table .ttl{font-weight:700}
.ad-table .sub{font-size:12.5px;color:#6b6152}
.ad-table .sub.warn,.ad-table .hot{color:var(--seal);font-weight:700}
.ad-table .part{color:#8a7f6a;font-style:italic}
.ad-table .sum{font-weight:700}
.ad-table .acts{white-space:nowrap}
.ad-table .acts .ad-btn{margin-left:6px;padding:4px 10px;font-size:13px}
.ad-chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12.5px;font-weight:700;background:#e9dfc4;color:#5a5140;white-space:nowrap}
.ad-chip.on{background:#d3e8d8;color:#215a39}
.ad-chip.warn{background:#f5d6ce;color:#9c2a18}
.ad-switch{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-size:13.5px}
.ad-switch input{width:18px;height:18px;accent-color:#256341;margin:0}
#admin input[type=text],#admin input[type=password],#admin input[type=number],#admin input[type=datetime-local],#admin select{border:1px solid #b3a57f;border-radius:8px;padding:6px 10px;background:#fff;color:var(--dark);font-size:14px;max-width:100%}
.ad-pick{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#6b6152}
.ad-login{max-width:400px;margin:9vh auto 0}
.ad-login label{display:grid;gap:6px;font-weight:700;font-size:14px}
.ad-fb .who{color:#6b6152;font-size:13.5px}
.ad-fb p{margin:10px 0}
.ad-fb .fb-a{font-size:13.5px;color:#6b6152}
.ad-fb .fb-t{font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ad-fb.done{opacity:.72}
.ad-rules{display:grid;gap:12px;justify-items:start}
.ad-rules label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.ad-rules input{width:84px;text-align:right}
@media (max-width:640px){.ad-wrap{padding:16px 12px 56px}.ad-top h1{font-size:24px}.ad-card{padding:12px}}
</style>
</head>
<body>
<div id="game"><div id="stage">

  <section class="screen" id="scr-title">
    <div class="fill glow"></div>
    <div class="fill" id="title-bg"></div>
    <div class="title-wrap">
      <div class="title-head">
        <p class="eyebrow">公民課・對話闖關</p>
        <h1 id="g-title">課程遊戲</h1>
        <p class="tagline" id="g-sub"></p>
      </div>
      <form class="card" id="auth-form" novalidate>
        <div class="seg" role="tablist" aria-label="登入或建立帳號">
          <button type="button" role="tab" id="tab-login" aria-selected="true">登入</button>
          <button type="button" role="tab" id="tab-reg" aria-selected="false">建立帳號</button>
        </div>
        <div class="fields">
          <label class="f wide" for="f-acc">帳號<input id="f-acc" name="account" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16" placeholder="英文或數字 3–16 個字"></label>
          <label class="f wide" for="f-pw" id="l-pw">密碼<input id="f-pw" name="password" type="password" autocomplete="current-password" maxlength="32" placeholder="至少 4 個字"></label>
          <label class="f reg" for="f-pw2" hidden>再輸入一次密碼<input id="f-pw2" name="password2" type="password" autocomplete="new-password" maxlength="32"></label>
          <label class="f reg" for="f-cls" hidden>班級<input id="f-cls" name="class" inputmode="numeric" maxlength="6" placeholder="例如 805"></label>
          <label class="f reg" for="f-seat" hidden>座號<input id="f-seat" name="seat" inputmode="numeric" maxlength="3" placeholder="例如 12"></label>
          <label class="f reg" for="f-name" hidden>姓名<input id="f-name" name="name" autocomplete="name" maxlength="20"></label>
        </div>
        <p class="msg" id="auth-msg" role="alert"></p>
        <button class="btn primary" type="submit" id="auth-go">登入</button>
      </form>
    </div>
    <p class="title-foot"><button class="link" id="b-admin" type="button">老師後台</button></p>
  </section>

  <section class="screen" id="scr-hub" hidden>
    <div class="fill glow"></div>
    <div class="hub-wrap">
      <header class="hub-head">
        <div><p class="eyebrow" id="hub-eyebrow">故事選單</p><h2 id="hub-title">課程遊戲</h2></div>
        <div class="who"><span id="who-label"></span><button class="btn" id="b-db" type="button" hidden>看後台記錄了什麼</button><button class="btn" id="logout" type="button">登出</button></div>
      </header>
      <div class="hub-body">
        <nav class="themes" id="themes" aria-label="主題"></nav>
        <div class="units-pane">
          <div class="theme-info" id="theme-info"></div>
          <p class="msg hub-msg" id="hub-msg" role="alert"></p>
          <ol class="units" id="units"></ol>
        </div>
      </div>
    </div>
    <div class="ov" id="ov-db" hidden>
      <div class="ov-head"><h3>後台會記錄的內容（預覽）</h3><button class="btn" type="button" data-close>關閉</button></div>
      <div class="ov-body" id="db-body"></div>
    </div>
  </section>

  <section class="screen" id="scr-brief" hidden>
    <div class="fill glow"></div>
    <div class="brief-wrap">
      <div class="card brief">
        <p class="eyebrow" id="br-series"></p>
        <h2 id="br-title"></h2>
        <dl id="br-list"></dl>
        <p class="notice" id="br-notice" hidden></p>
        <div class="gate" id="br-gate" hidden>
          <label class="f" for="gate-in">請輸入上一個單元拿到的通關金鑰<input id="gate-in" autocomplete="off" maxlength="40"></label>
          <button class="btn" type="button" id="gate-go">解鎖</button>
        </div>
        <p class="msg" id="br-msg" role="alert"></p>
        <div class="row">
          <button class="btn" type="button" id="br-back">回故事選單</button>
          <button class="btn primary" type="button" id="br-start">開始</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-play" hidden>
    <div class="fill bg" id="bgA"></div>
    <div class="fill bg" id="bgB"></div>
    <div class="hud">
      <div class="hud-left">
        <span class="plate unit-name" id="hud-unit"></span>
        <span class="plate mode" id="hud-mode" hidden>練習中，不計分</span>
        <button class="plate sync" id="hud-sync" type="button" hidden></button>
      </div>
      <div class="hud-right">
        <span class="plate score" id="hud-score"></span>
        <button class="hbtn" id="b-auto" type="button" aria-pressed="false">自動</button>
        <button class="hbtn" id="b-ff" type="button" aria-pressed="false">快轉</button>
        <button class="hbtn" id="b-log" type="button">紀錄</button>
        <button class="hbtn" id="b-set" type="button">設定</button>
        <button class="hbtn" id="b-menu" type="button">選單</button>
      </div>
    </div>
    <div class="stamp" id="stamp" aria-hidden="true">正確</div>
    <div class="dock">
      <div class="above">
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="sheet onpaper" id="sheet" hidden><h4>請完成這段話</h4><div class="talk" id="sheet-body"></div></div>
        <div class="choices" id="choices" hidden></div>
        <aside class="note onpaper" id="note" hidden></aside>
      </div>
      <div class="dlg" id="dlg">
        <div class="dlg-name" id="dlg-name"></div>
        <p class="dlg-text talk" id="dlg-text"></p>
        <div class="dlg-foot">
          <span class="dlg-tip" id="dlg-tip"></span>
          <div class="dlg-actions" id="dlg-actions" hidden>
            <button class="link" id="b-fb" type="button">題目有問題？</button>
            <button class="btn" id="b-hint" type="button">看提示</button>
            <button class="btn primary" id="b-submit" type="button">送出答案</button>
          </div>
          <span class="dlg-next" id="dlg-next" aria-hidden="true" hidden>▼</span>
        </div>
      </div>
    </div>
    <div class="ov" id="ov-log" hidden>
      <div class="ov-head"><h3>對話紀錄</h3><button class="btn" type="button" data-close>關閉</button></div>
      <div class="ov-body" id="log-body"></div>
    </div>
    <div class="ov" id="ov-set" hidden>
      <div class="ov-head"><h3>設定</h3><button class="btn" type="button" data-close>關閉</button></div>
      <div class="ov-body">
        <div class="set-row"><span>文字速度</span><div class="seg" id="set-speed"><button type="button" data-v="slow">慢</button><button type="button" data-v="normal">中</button><button type="button" data-v="fast">快</button></div></div>
        <div class="set-row"><span>文字大小</span><div class="seg" id="set-size"><button type="button" data-v="1">標準</button><button type="button" data-v="1.18">大</button></div></div>
        <div class="set-row"><span>打字音效</span><div class="seg" id="set-sound"><button type="button" data-v="off">關</button><button type="button" data-v="on">開</button></div></div>
      </div>
    </div>

/* SHA-256，用來比對答案（頁面上只有答案的雜湊，沒有答案本身） */
const sha256hex = window.sha256hex = (() => {
  const isPrime = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  const K = []; for (let n = 2; K.length < 64; n++) if (isPrime(n)) K.push(Math.floor((Math.cbrt(n) % 1) * 4294967296) >>> 0);

    const bytes = new TextEncoder().encode(str), l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;

    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);

}
const fAcc = byId('f-acc'), fPw = byId('f-pw'), fPw2 = byId('f-pw2'), fCls = byId('f-cls'), fSeat = byId('f-seat'), fName = byId('f-name'), authMsg = byId('auth-msg');

/* 登入畫面的背景圖。雲端硬碟的圖要開放「知道連結的任何人可檢視」，登入前才讀得到。

/* ══════════ 單元簡報：計分提醒與通關金鑰 ══════════ */
const MARK = /【任務([^】]+)】/g;

  st.src = {};

    for (const m of l.text.matchAll(MARK)) {
      for (const c of l.text.slice(last, m.index)) l.tok.push({ c });
      const id = m[1];
      if (st.tasks[id]) { l.tok.push({ slot: id, k: count[id] = (count[id] || 0), n: count[id]++ }); (st.src[id] = st.src[id] || []).includes(i) || st.src[id].push(i); }

/* ══════════ 存檔佇列：答對的題目依序送到後台，失敗會重試 ══════════ */
const Q = { items: [], busy: false, failed: false };
const syncEl = byId('hud-sync');
function syncBadge() {
  syncEl.hidden = !(Q.failed || Q.items.length);
  syncEl.textContent = Q.failed ? '有題目沒存到，按這裡重試' : '儲存中…';
}
function queueSave(payload, onAck) { if (S.preview) payload.preview = true; Q.items.push({ payload, onAck, tries: 0 }); pump(); }
async function pump() {
  if (Q.busy) return;
  Q.busy = true; Q.failed = false; syncBadge();
  while (Q.items.length) {
    const it = Q.items[0], r = await call('task', it.payload);
    if (!S.token && !it.payload.preview) break;
    if (r.ok || !r.net) { Q.items.shift(); if (it.onAck) it.onAck(r); }
    else if (++it.tries >= 4) { Q.failed = true; break; }
    else await sleep(1200 * it.tries);
    syncBadge();
  }
  Q.busy = false; syncBadge();
}
syncEl.addEventListener('click', () => { if (Q.failed) pump(); });
async function drain() { for (let i = 0; i < 150 && Q.items.length && !Q.failed; i++) await sleep(200); return !Q.items.length; }

/* 解析：同一個任務組的空格全部答對後，才一次顯示整組的解析（一樣的句子只列一次）。
   「任務組」留白的題目自己算一組。答對後拿到的解析存在這台電腦，學生中途離開、回來做完這一組，前面的解析也會一起出現。 */
const EKEY = 'course-game-explain-v1';

    const keys = Object.keys(all); keys.slice(0, Math.max(0, keys.length - 30)).forEach(x => delete all[x]);

}

const picCache = {};

  if (!p.src.startsWith('drive:')) return picCache[key] = loadImg(p.src).catch(() => '');
  const id = p.src.slice(6);
  return picCache[key] = loadImg(`https://drive.google.com/thumbnail?id=${id}&sz=w1600`)
    .catch(() => loadImg(`https://lh3.googleusercontent.com/d/${id}=w1600`))
    .catch(() => call('img', { id }).then(r => r.ok ? r.data : ''))

/* ── 任務：填空、單選、複選 ── */
const firstInput = () => G.open.map(id => byId('ans-' + id)).find(n => n);
const openIds = () => G.open.filter(id => !rec(id).done);
function enterTask(ids) {
  const st = S.story, line = st.lines[G.idx];
  G.mode = 'task'; G.open = ids.slice(); nextEl.hidden = true; actionsEl.hidden = false; hintBtn.hidden = false;
  const away = ids.filter(id => !line.ids.includes(id));
  if (away.length) {                                   // 空格在前面幾句：把那幾句列在「請完成這段話」
    const src = [...new Set(away.flatMap(id => st.src[id] || []))].sort((a, b) => a - b);
    sheetBody.textContent = '';
    src.forEach(i => { const p = el('p'); buildLine(p, st.lines[i], false); sheetBody.appendChild(p); });
    sheetEl.hidden = false;
  }
  let hasFill = false;
  for (const id of ids) {
    const t = task(id), slots = slotsOf(id);
    if (t.type === '填空') {
      hasFill = true;
      const s = slots[0]; if (!s) continue;
      const body = $('.slot-body', s); body.textContent = '';
      const inp = el('input'); inp.id = 'ans-' + id; inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.maxLength = 20;
      inp.setAttribute('aria-label', `任務${id}的答案`);

      inp.style.width = Math.max(4.4, t.len + 2) + 'em';

    }

  setFocus(ids[0]);

  x.type = 'button'; x.addEventListener('click', () => { A.stats = null; renderAdmin(); }); head.appendChild(x);
  card.appendChild(head);
  card.appendChild(el('p', 'ad-note', `只算「正式」作答，共 ${s.people} 位學生。紅字是平均答錯 1 次以上、或三成以上的人看了答案的題目，可以回頭檢查題目和答案。`));
  const { wrap, tb } = adTable(['任務', '題目', '答案', ['作答人數', 'num'], ['平均答錯', 'num'], ['提示次數', 'num'], ['看答案', 'num'], ['平均得分', 'num'], '常見的錯誤答案']);
  for (const t of s.tasks) {
    const tr = el('tr'), avg = t.n ? t.wrong / t.n : 0;
    tr.appendChild(el('td', 'code', t.id)); tr.appendChild(el('td', '', t.q)); tr.appendChild(el('td', '', t.answer));
    tr.appendChild(el('td', 'num', String(t.n)));
    tr.appendChild(el('td', 'num' + (avg >= 1 ? ' hot' : ''), t.n ? fmt(avg) : '—'));
    tr.appendChild(el('td', 'num', t.n ? String(t.hints) : '—'));
    tr.appendChild(el('td', 'num' + (t.n && t.reveal / t.n >= .3 ? ' hot' : ''), t.n ? `${t.reveal} 人` : '—'));
    tr.appendChild(el('td', 'num', t.n ? `${fmt(t.score / t.n)}／${fmt(t.points)}` : '—'));
    tr.appendChild(el('td', '', t.bad.map(b => `${b.text}（${b.n}）`).join('、')));
    tb.appendChild(tr);
  }
  card.appendChild(wrap);
  return card;
}

/* ── 成績 ── */
function downloadCsv(name, rows) {
  const cell = c => { c = String(c == null ? '' : c); if (/^[=+@]/.test(c)) c = "'" + c; return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; };
  const a = el('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function adScores() {
  const d = A.data;
  if (!d.students.length) { adPane.appendChild(el('p', 'ad-note', '還沒有學生建立帳號。')); return; }
  const classes = [...new Set(d.students.map(s => s.cls))].sort(byClass), active = new Set(d.progress.map(p => p.u));
  let themes = d.themes.filter(t => d.units.some(u => u.theme === t.no && (u.open || active.has(u.code))));
  if (!themes.length) themes = d.themes;
  if (!themes.some(t => t.no === A.theme)) {          /* 預設看作答紀錄最多的主題 */
    const count = t => d.progress.filter(p => d.units.some(u => u.code === p.u && u.theme === t.no)).length;
    A.theme = (themes.slice().sort((a, b) => count(b) - count(a))[0] || {}).no || '';
  }
  if (A.cls && !classes.includes(A.cls)) A.cls = '';
  const bar = el('div', 'ad-row'), csv = el('button', 'ad-btn', '下載成 CSV'); csv.type = 'button';
  bar.appendChild(pick('班級', [['', '全部班級'], ...classes.map(c => [c, `${c} 班`])], A.cls, v => { A.cls = v; renderAdmin(); }));
  bar.appendChild(pick('主題', themes.map(t => [t.no, `主題 ${t.no}　${themeName(t)}`]), A.theme, v => { A.theme = v; renderAdmin(); }));
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) { csv.disabled = true; csv.title = '這個預覽頁不能下載檔案，放上 GitHub 的正式網站可以。'; }
  bar.appendChild(csv); adPane.appendChild(bar);
  const units = d.units.filter(u => u.theme === A.theme), prog = {};
  d.progress.forEach(p => { prog[p.a + '|' + p.u] = p; });
  const head = ['班級', '座號', '姓名', '帳號', ...units.map(u => u.code), '合計'], rows = [];
  const card = el('section', 'ad-card'), { wrap, tb } = adTable(head.map((h, i) => i > 3 ? [h, 'num'] : h));
  units.forEach((u, i) => { tb.rows[0].cells[i + 4].title = (u.title || '') + (u.max != null ? `（滿分 ${fmt(u.max)}）` : ''); });
  for (const s of d.students.filter(x => !A.cls || x.cls === A.cls).sort(sortStudents)) {
    const tr = el('tr'), row = [s.cls, s.seat, s.name, s.id]; let sum = 0;
    row.forEach(c => tr.appendChild(el('td', '', c)));
    for (const u of units) {
      const p = prog[s.id.toLowerCase() + '|' + u.code], td = el('td', 'num', p ? fmt(p.s) : '');
      if (p) { sum += p.s; if (!p.d) { td.classList.add('part'); td.title = '還沒通關'; } }
      row.push(p ? fmt(p.s) : ''); tr.appendChild(td);
    }
    tr.appendChild(el('td', 'num sum', fmt(sum))); row.push(fmt(sum)); rows.push(row); tb.appendChild(tr);
  }
  card.appendChild(wrap);
  card.appendChild(el('p', 'ad-note', '分數只算計分截止時間之前的「正式」作答。灰色斜體表示還沒通關。滑鼠移到單元代號上可以看到標題和滿分。'));
  adPane.appendChild(card);
  csv.addEventListener('click', () => downloadCsv(`成績_主題${A.theme}${A.cls ? '_' + A.cls + '班' : ''}.csv`, [head, ...rows]));
}

/* ── 題目回饋 ── */
function adFeedback() {
  const d = A.data;
  if (!d.feedback.length) { adPane.appendChild(el('p', 'ad-note', '還沒有學生送出題目回饋。學生作答時按「題目有問題？」，內容就會出現在這裡。')); return; }
  const list = d.feedback.slice().sort((a, b) => (a.status === '已處理') - (b.status === '已處理') || b.time - a.time);
  for (const f of list) {
    const done = f.status === '已處理', card = el('section', 'ad-card ad-fb' + (done ? ' done' : '')), head = el('div', 'ad-row');
    head.appendChild(el('span', 'ad-chip' + (done ? ' on' : ' warn'), done ? '已處理' : '待處理'));
    head.appendChild(el('b', '', `${f.unit}　任務 ${f.task}`));
    head.appendChild(el('span', 'who', `${f.cls} 班 ${f.seat} 號　${f.name}　${fmtFull(f.time)}`));
    card.appendChild(head);
    if (f.answer) card.appendChild(el('p', 'fb-a', `學生當時填的答案：${f.answer}`));
    card.appendChild(el('p', 'fb-t', f.text));
    const row = el('div', 'ad-row'), note = el('input'), save = el('button', 'ad-btn', '存備註'), tog = el('button', 'ad-btn' + (done ? '' : ' pri'), done ? '改回待處理' : '標成已處理');
    note.type = 'text'; note.maxLength = 300; note.className = 'grow'; note.placeholder = '老師備註（只有老師看得到）'; note.value = f.note; note.setAttribute('aria-label', '老師備註');
    save.type = tog.type = 'button';
    const send = async patch => {
      save.disabled = tog.disabled = true;
      const r = await call('adminFeedback', Object.assign({ row: f.row, id: f.id, task: f.task, note: note.value }, patch));
      save.disabled = tog.disabled = false;
      if (!r.ok) { if (r.adminRelogin) return openAdmin(); adSay(r.error); return; }
      f.note = note.value.trim(); if (patch.status) f.status = patch.status;
      renderAdmin(); adSay('已儲存。', true);
    };
    save.addEventListener('click', () => send({}));
    tog.addEventListener('click', () => send({ status: done ? '待處理' : '已處理' }));
    row.appendChild(note); row.appendChild(save); row.appendChild(tog); card.appendChild(row);
    adPane.appendChild(card);
  }
}

/* ── 帳號 ── */
function adAccounts() {
  const d = A.data;
  if (!d.students.length) { adPane.appendChild(el('p', 'ad-note', '還沒有學生建立帳號。')); return; }
  const classes = [...new Set(d.students.map(s => s.cls))].sort(byClass);
  if (A.cls && !classes.includes(A.cls)) A.cls = '';
  const bar = el('div', 'ad-row');
  bar.appendChild(pick('班級', [['', '全部班級'], ...classes.map(c => [c, `${c} 班`])], A.cls, v => { A.cls = v; renderAdmin(); }));
  adPane.appendChild(bar);
  adPane.appendChild(el('p', 'ad-note', '學生忘記密碼時按「重設密碼」。之後請他用原本的帳號登入，那一次輸入的密碼就會成為新密碼。'));
  const card = el('section', 'ad-card'), { wrap, tb } = adTable(['班級', '座號', '姓名', '帳號', '建立時間', '最後登入', '密碼']);
  for (const s of d.students.filter(x => !A.cls || x.cls === A.cls).sort(sortStudents)) {
    const tr = el('tr');
    [s.cls, s.seat, s.name, s.id, fmtFull(s.created), fmtFull(s.last)].forEach(c => tr.appendChild(el('td', '', c)));
    const td = el('td', 'acts');
    if (!s.pw) td.appendChild(el('span', 'ad-chip warn', '等學生設定新密碼'));
    else {
      const b = el('button', 'ad-btn', '重設密碼'); b.type = 'button'; let armed = 0;
      b.addEventListener('click', async () => {
        if (!armed) { armed = setTimeout(() => { armed = 0; b.textContent = '重設密碼'; b.classList.remove('warn'); }, 4000); b.textContent = '確定重設？'; b.classList.add('warn'); return; }
        clearTimeout(armed); b.disabled = true;
        const r = await call('adminResetPassword', { account: s.id });
        if (!r.ok) { if (r.adminRelogin) return openAdmin(); b.disabled = false; adSay(r.error); return; }
        s.pw = false; renderAdmin(); adSay(`已清除 ${s.name} 的密碼。請他用帳號 ${s.id} 登入，這次輸入的密碼就是新密碼。`, true);
      });
      td.appendChild(b);
    }
    tr.appendChild(td); tb.appendChild(tr);
  }
  card.appendChild(wrap); adPane.appendChild(card);
}

/* ── 計分規則 ── */
function adRules() {
  const R = A.data.rules, card = el('section', 'ad-card'), form = el('form', 'ad-rules'), inputs = {};
  card.appendChild(el('h2', '', '計分規則'));
  card.appendChild(el('p', 'ad-note', '修改後只影響之後的作答，已經記下的分數不會變。'));
  [['wrong', '每答錯一次，扣該題配分的'], ['hint', '每看一則提示，扣該題配分的'], ['floor', '自己答對，最少拿到配分的'], ['reveal', '看了答案才完成，拿到配分的']].forEach(([k, label]) => {
    const lab = el('label', '', label), inp = el('input');
    inp.type = 'number'; inp.min = 0; inp.max = 100; inp.step = 5; inp.value = Math.round(R[k] * 100);
    lab.appendChild(inp); lab.append('%'); form.appendChild(lab); inputs[k] = inp;
  });
  const ex = el('p', 'ad-note'), btn = el('button', 'ad-btn pri', '儲存'); btn.type = 'submit';
  const val = k => Math.max(0, Math.min(100, Number(inputs[k].value) || 0)) / 100;
  const example = () => {
    const w = val('wrong'), f = val('floor'), sc = n => fmt(Math.max(2 * f, 2 * (1 - n * w)));
    ex.textContent = `以配分 2 分的題目為例（沒看提示）：一次答對得 2 分，答錯 1 次得 ${sc(1)} 分，答錯 2 次得 ${sc(2)} 分，答錯再多次最少 ${fmt(2 * f)} 分；看了答案才完成得 ${fmt(2 * val('reveal'))} 分。`;
  };
  form.addEventListener('input', example); example();
  form.addEventListener('submit', async e => {
    e.preventDefault(); btn.disabled = true;
    const r = await call('adminRules', { wrong: val('wrong'), hint: val('hint'), floor: val('floor'), reveal: val('reveal') });
    btn.disabled = false;
    if (!r.ok) { if (r.adminRelogin) return openAdmin(); adSay(r.error); return; }
    A.data.rules = r.rules; adSay('計分規則已儲存。', true);
  });
  form.appendChild(ex); form.appendChild(btn); card.appendChild(form); adPane.appendChild(card);
}

/* ══════════ 啟動 ══════════ */
fit(); show('title');
(async () => {
  authMsg.className = 'msg good'; authMsg.textContent = '連線中…';
  const r = await call('boot');
  authMsg.className = 'msg'; authMsg.textContent = '';
  if (!r.ok) { authMsg.textContent = r.error; return; }
  applyUniverse(r);
  if (r.user) { S.user = r.user; S.progress = r.progress || {}; show('hub'); }
  else if (S.token) { S.token = ''; persist(); }
  if (location.hash === '#admin') openAdmin();
})();
})();
</script>
